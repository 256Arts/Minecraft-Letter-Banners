org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft, shared by both loaders. The range is NeoForge's dependency syntax;
# Fabric gets `~minecraft_version`.
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)

# Fabric properties, checked against https://fabricmc.net/develop
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.158.0+26.2

# NeoForge properties, checked against https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.2.0.75
moddev_version=2.0.144

# Mod properties
version=1.0.0
group=com.arts256.letterbanners
