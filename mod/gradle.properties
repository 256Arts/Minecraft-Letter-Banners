org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft, shared by both loaders. The range is NeoForge's dependency syntax;
# Fabric gets `~minecraft_version`.
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)

# Fabric properties, checked against https://fabricmc.net/develop
loader_version=0.19.5
loom_version=1.18.2
fabric_api_version=0.160.6+26.3

# NeoForge properties, checked against https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.3-beta
moddev_version=2.0.147

# Mod properties
version=1.1.0
group=com.arts256.letterbanners
